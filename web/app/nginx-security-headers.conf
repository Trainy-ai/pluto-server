# Browser security headers shared by every response nginx serves.
#
# Included at the server level of nginx.conf and re-included inside every
# location that has an add_header of its own (nginx does not inherit
# add_header across that boundary). Copied into the image at
# /etc/nginx/snippets/ — deliberately NOT /etc/nginx/conf.d/, whose *.conf
# files the base image auto-includes at http level, where these directives
# would be invalid.
#
# X-Frame-Options is intentionally not here: it is DENY everywhere except
# /stlite/panel-host.html (SAMEORIGIN — the page is loaded in a same-origin
# sandboxed iframe), and add_header can only add a second header, never
# replace one; two conflicting X-Frame-Options values fail closed to DENY.
# Each include site states X-Frame-Options itself.
#
# `always` keeps the headers on 4xx/5xx responses too.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
