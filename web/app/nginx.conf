# Pinned frontend version → which index.html to serve.
# The cookie (set by the in-app version switcher / a `?fe=` link) names a
# release whose entry document lives at /v/<version>/index.html. The image
# bakes in the last N releases side-by-side; their content-hashed assets are
# all merged into /assets/, so only the entry document differs per version.
# No cookie → latest build at /index.html. The charset is restricted and `..`
# is rejected (mirrors isValidVersion in src/lib/frontend-version.ts) so the
# cookie can't be used for path traversal; an unknown version simply falls
# through to latest below.
map $cookie_mlop_fe_version $fe_index {
    default                          /index.html;
    "~^(?!.*\.\.)[A-Za-z0-9._-]+$"   /v/$cookie_mlop_fe_version/index.html;
}

server {
    listen       3000;
    server_name  localhost;

    # Never advertise the nginx version: Server: nginx, not nginx/x.y.z.
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # Browser security headers on every response this server sends.
    # nginx pitfall: add_header is NOT inherited into a location that has
    # an add_header of its own, so each such location below re-includes
    # the snippet and re-states X-Frame-Options (see the snippet for why
    # that one line lives outside it). Proxied /trpc and /api responses
    # inherit these too and additionally carry the backend's own identical
    # copy (hono secureHeaders); the values match, so that is harmless.
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Frame-Options DENY always;

    # SPA Content-Security-Policy — REPORT-ONLY for this first iteration,
    # set only where an entry document is served (the `= /` and `/`
    # blocks): CSP governs documents, so proxied JSON and hashed assets
    # gain nothing from it. Violations surface in the browser console (no
    # report-to endpoint yet); switch to an enforced Content-Security-Policy
    # once they have been reviewed. Why it cannot be tighter yet:
    # - img/media/connect-src stay at https: because presigned S3/MinIO
    #   URLs (images, audio, video), PostHog and the API/py hosts are
    #   deployment-specific, and this file is baked into the image with a
    #   plain COPY (no templating), so exact hosts cannot be pinned here.
    # - index.html has no inline scripts (/env-config.js is same-origin),
    #   so script-src 'self' is the intended end state.
    # - srcdoc iframes (sandboxed-html-view.tsx) inherit this policy, so
    #   enforcing script-src 'self' later will block scripts inside logged
    #   HTML previews — a product decision for the enforcement follow-up.
    # The /stlite/ locations below have their own enforced CSP and must
    # not get this one.
    set $spa_csp_report_only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # Enable gzip for proxied API responses (tRPC JSON payloads can be 5+ MB)
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/plain application/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 1;

    location /trpc {
        proxy_pass http://backend:3001/trpc;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # Buffer backend response so gzip compresses efficiently in one pass
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 32 128k;
        proxy_busy_buffers_size 256k;
    }

    location ~ ^/api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # Static assets (JS, CSS, images, fonts) — return 404 if missing.
    # Prevents serving index.html with wrong MIME type for stale hashed filenames.
    location /assets/ {
        try_files $uri =404;
    }

    # Python Panels sandbox host page — strict CSP: the sandboxed iframe
    # (opaque origin) may only load our vendored runtime assets from this
    # host; 'unsafe-eval'/'wasm-unsafe-eval' are inherent to Pyodide and
    # contained by the sandbox. script-src needs data: because stlite
    # embeds its worker as a data: URL that its blob wrapper importScripts.
    # The real isolation control is connect-src 'self' (no network egress).
    # img-src keeps the * wildcard DELIBERATELY: panels render files via
    # mlop.get_file_url() presigned URLs pointing at the deployment's
    # STORAGE_ENDPOINT (MinIO/S3/R2 — a runtime concern; this file is
    # baked into the image with a plain COPY, no envsubst templating in
    # this repo, and there is no backend file-proxy route to pin instead).
    # Accepted residual: GET-only image-beacon exfil of data the viewer
    # can already read — documented in docs/python-panels.md. Self-hosted
    # deployments that know their storage host can tighten this line.
    # Exact match wins over the /stlite/ prefix block below; headers do
    # NOT inherit across blocks, so ACAO and the security snippet repeat.
    # This page is framed by the app (panel-sandbox.tsx), so it gets
    # X-Frame-Options SAMEORIGIN and frame-ancestors 'self' rather than
    # the DENY every other response carries. Keep in sync with
    # PANEL_HOST_CSP in vite.config.ts.
    location = /stlite/panel-host.html {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: data:; connect-src 'self'; worker-src blob:; img-src blob: data: *; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'self'";
    }

    # Companion module of the host page — committed source, so mutable
    # (no immutable caching), unlike the pinned runtime assets below.
    location = /stlite/panel-host.js {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options DENY always;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
    }

    # Vendored stlite/Pyodide runtime assets (fetched at image build by
    # scripts/fetch-panel-assets.mjs). MUST precede the SPA fallback:
    # a missing asset must 404, never serve index.html. The sandboxed
    # iframe's opaque origin makes every fetch cross-origin → ACAO
    # required. Files are version-pinned → immutable caching.
    location /stlite/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options DENY always;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000, immutable";

        # nginx's stock mime.types has no .mjs mapping, so pyodide.mjs
        # would ship as application/octet-stream — and the worker's ES
        # module import() enforces a JavaScript MIME type, failing the
        # whole Pyodide boot. Nested location inherits try_files/headers.
        location ~ \.mjs$ {
            default_type text/javascript;
        }
    }

    # Root must be an exact match: otherwise `try_files $uri` treats "/" as a
    # directory and the `index` directive serves the latest index.html before
    # $fe_index is consulted, ignoring a pinned cookie on the landing page.
    location = / {
        try_files $fe_index /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy-Report-Only $spa_csp_report_only always;
    }

    # SPA fallback — all other routes serve the pinned version's index.html
    # (or the latest build's index.html when unpinned / pinned version missing)
    # for client-side routing.
    location / {
        try_files $uri $fe_index /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy-Report-Only $spa_csp_report_only always;
    }
}
